name: dronehub
description: DroneHub - Premium Drone Parts E-commerce
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.4

  # HTTP
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Auth
  google_sign_in: ^6.2.1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Fonts
  google_fonts: ^6.2.1

  # Video
  video_player: ^2.9.2

  # UI / Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.2.0+3
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

  # Map & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # Utils
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  uuid: ^4.4.0
  badges: ^3.1.2
  toastification: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/videos/
